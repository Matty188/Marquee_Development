<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .body{
            height: auto;
            width: 800px;
            border: 2px solid black;
            display: flex;
            justify-content:center;
            justify-content:space-around;
            flex-wrap: wrap;
            align-items: center;
        }
        .box{
            background-color: aliceblue;
            justify-content: middle;
            text-align: center;
            height: auto;
            width: 50px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div class="body">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
